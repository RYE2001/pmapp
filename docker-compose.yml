version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmapp
      POSTGRES_PASSWORD: pmapp
      POSTGRES_DB: pmapp
    ports:
      - "5432:5432"
    volumes:
      - pm_app_pgdata:/var/lib/postgresql/data

volumes:
  pm_app_pgdata:
